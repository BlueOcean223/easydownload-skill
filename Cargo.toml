[package]
name = "easydl"
version = "0.2.0-dev"
edition = "2024"
description = "Agent-friendly media downloader CLI"

[lib]
path = "src/lib.rs"

[[bin]]
name = "easydl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
png = "0.17"
qrcode = { version = "0.14", default-features = false }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"
zip = { version = "2.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
