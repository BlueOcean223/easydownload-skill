# Build standalone easydl binaries for Linux / macOS / Windows and publish a GitHub Release.
#
# Trigger:
#   - push tag v* (e.g. v0.1.0) → create/update a published release
#   - workflow_dispatch → optional tag input; without tag uploads artifacts only
#
# Artifact layout matches README distribution package:
#   bin/easydl-darwin-arm64
#   bin/easydl-darwin-x64
#   bin/easydl-linux-x64
#   bin/easydl-linux-arm64
#   bin/easydl-windows-x64.exe
#   SKILL.md
#   README.md

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0). Leave empty to only upload build artifacts."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Compile & package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Compile multi-platform binaries
        run: |
          set -euo pipefail
          mkdir -p bin

          compile() {
            local target="$1"
            local outfile="$2"
            echo "::group::bun build --compile --target=${target} → ${outfile}"
            bun build src/cli.ts \
              --compile \
              --target="${target}" \
              --outfile="${outfile}"
            ls -lh "${outfile}"
            echo "::endgroup::"
          }

          # Targets align with README bin/ names (+ darwin-x64 for Intel Mac).
          compile bun-darwin-arm64  bin/easydl-darwin-arm64
          compile bun-darwin-x64    bin/easydl-darwin-x64
          compile bun-linux-x64     bin/easydl-linux-x64
          compile bun-linux-arm64   bin/easydl-linux-arm64
          compile bun-windows-x64   bin/easydl-windows-x64.exe

          chmod +x bin/easydl-darwin-arm64 bin/easydl-darwin-x64 bin/easydl-linux-x64 bin/easydl-linux-arm64

      - name: Smoke-test Linux x64 binary
        run: |
          ./bin/easydl-linux-x64 --help
          ./bin/easydl-linux-x64 --version

      - name: Package distribution zip
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME}"
          elif [ -n "${INPUT_TAG:-}" ]; then
            VERSION="${INPUT_TAG}"
          else
            VERSION="dev-${GIT_SHA:0:7}"
          fi
          # Strip leading v for archive name if present
          ARCHIVE_VERSION="${VERSION#v}"
          DIST_DIR="dist/easydownload-skill-${ARCHIVE_VERSION}"
          mkdir -p "${DIST_DIR}/bin"

          cp bin/easydl-darwin-arm64 \
             bin/easydl-darwin-x64 \
             bin/easydl-linux-x64 \
             bin/easydl-linux-arm64 \
             bin/easydl-windows-x64.exe \
             "${DIST_DIR}/bin/"
          cp README.md SKILL.md "${DIST_DIR}/"

          (
            cd dist
            zip -r "easydownload-skill-${ARCHIVE_VERSION}.zip" "easydownload-skill-${ARCHIVE_VERSION}"
            shasum -a 256 "easydownload-skill-${ARCHIVE_VERSION}.zip" > "easydownload-skill-${ARCHIVE_VERSION}.zip.sha256"
          )

          # Also publish individual binaries for single-platform download
          (
            cd bin
            shasum -a 256 \
              easydl-darwin-arm64 \
              easydl-darwin-x64 \
              easydl-linux-x64 \
              easydl-linux-arm64 \
              easydl-windows-x64.exe \
              > checksums.txt
          )

          echo "ARCHIVE_VERSION=${ARCHIVE_VERSION}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -lh dist/ bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easydownload-skill-${{ env.ARCHIVE_VERSION }}
          path: |
            dist/*.zip
            dist/*.sha256
            bin/easydl-*
            bin/checksums.txt
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release_meta
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=""
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "${TAG}" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: easydownload-skill ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          # workflow_dispatch without an existing tag can create the tag from this SHA
          make_latest: true
          files: |
            dist/*.zip
            dist/*.sha256
            bin/easydl-darwin-arm64
            bin/easydl-darwin-x64
            bin/easydl-linux-x64
            bin/easydl-linux-arm64
            bin/easydl-windows-x64.exe
            bin/checksums.txt
          body: |
            ## Prebuilt binaries

            Standalone `easydl` executables (Bun runtime embedded — no Bun install required).

            | Platform | File |
            | --- | --- |
            | macOS Apple Silicon | `easydl-darwin-arm64` |
            | macOS Intel | `easydl-darwin-x64` |
            | Linux x64 | `easydl-linux-x64` |
            | Linux arm64 | `easydl-linux-arm64` |
            | Windows x64 | `easydl-windows-x64.exe` |

            Full distribution package: `easydownload-skill-*.zip` (`bin/` + `SKILL.md` + `README.md`).

            ```bash
            chmod +x easydl-darwin-arm64   # or the binary for your platform
            cp easydl-darwin-arm64 ~/.local/bin/easydl
            easydl --help
            ```

            **Note:** `ffmpeg` is not bundled. Install it separately for Bilibili DASH merge.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
