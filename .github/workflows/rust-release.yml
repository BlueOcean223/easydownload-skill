name: Rust v0.2 release

on:
  push:
    tags:
      - "v0.2.*"
    # Artifact-only RC builds: workflow_dispatch is unavailable until this file exists on main.
    branches:
      - rs
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - ".github/workflows/rust-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional v0.2.x tag to create after every target passes. Leave empty for artifacts only."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify Rust
        run: |
          bash -n scripts/smoke-real.sh
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

  build:
    name: ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: easydl-darwin-arm64
            binary: target/aarch64-apple-darwin/release/easydl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: easydl-darwin-x64
            binary: target/x86_64-apple-darwin/release/easydl
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: easydl-linux-x64
            binary: target/x86_64-unknown-linux-musl/release/easydl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: easydl-linux-arm64
            binary: target/aarch64-unknown-linux-musl/release/easydl
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: easydl-windows-x64.exe
            binary: target/x86_64-pc-windows-msvc/release/easydl.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build locked release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        env:
          SOURCE: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$SOURCE" "release/$ARTIFACT"
          if [[ "$ARTIFACT" != *.exe ]]; then chmod +x "release/$ARTIFACT"; fi
          ls -lh "release/$ARTIFACT"

      - name: Smoke-test CLI and atomic private file replacement
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          EASYDL_CONFIG_DIR: ${{ runner.temp }}/easydl-rust-smoke
        run: |
          set -euo pipefail
          BIN="release/$ARTIFACT"
          "$BIN" --version
          "$BIN" --help
          "$BIN" execute --config set --config-key concurrency --config-value 2 --json
          "$BIN" execute --config set --config-key concurrency --config-value 3 --json
          "$BIN" execute --config get --json | grep '"concurrency": 3'
          "$BIN" execute --bilibili-auth status --json | grep '"platform": "bilibili"'

      - name: Verify Linux binary has no ELF interpreter
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          file "release/$ARTIFACT"
          if readelf -l "release/$ARTIFACT" | grep -q 'INTERP'; then
            echo "Linux release unexpectedly contains a dynamic ELF interpreter" >&2
            exit 1
          fi

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Bundle and optionally publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG=""
          if [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"; fi
          if [ -n "${INPUT_TAG:-}" ]; then TAG="$INPUT_TAG"; fi
          if [ -n "$TAG" ] && [[ ! "$TAG" =~ ^v0\.2\.[0-9]+([.-].*)?$ ]]; then
            echo "Rust releases must use a v0.2.x tag: $TAG" >&2
            exit 1
          fi
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION="dev-${GIT_SHA:0:7}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: easydl-*
          path: release/bin
          merge-multiple: true

      - name: Create checksums and distribution archives
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x release/bin/easydl-darwin-* release/bin/easydl-linux-*
          (
            cd release/bin
            sha256sum easydl-* > checksums.txt
          )
          cp README.md SKILL.md release/
          cp docs/rust-development.md release/RUST-DEVELOPMENT.md
          printf '%s\n' "$GIT_SHA" > release/GIT_SHA
          tar -C release -czf "easydownload-skill-${ARCHIVE_VERSION}.tar.gz" .
          (
            cd release
            zip -r "../easydownload-skill-${ARCHIVE_VERSION}.zip" .
          )
          sha256sum \
            "easydownload-skill-${ARCHIVE_VERSION}.tar.gz" \
            "easydownload-skill-${ARCHIVE_VERSION}.zip" \
            > "easydownload-skill-${ARCHIVE_VERSION}.checksums.txt"
          ls -lh release/bin easydownload-skill-*

      - name: Upload complete release bundle
        uses: actions/upload-artifact@v4
        with:
          name: easydownload-skill-rust-${{ github.sha }}
          path: |
            easydownload-skill-*.tar.gz
            easydownload-skill-*.zip
            easydownload-skill-*.checksums.txt
            release/bin/checksums.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: easydownload-skill ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-') }}
          files: |
            easydownload-skill-*.tar.gz
            easydownload-skill-*.zip
            easydownload-skill-*.checksums.txt
            release/bin/easydl-darwin-arm64
            release/bin/easydl-darwin-x64
            release/bin/easydl-linux-x64
            release/bin/easydl-linux-arm64
            release/bin/easydl-windows-x64.exe
            release/bin/checksums.txt
          body: |
            ## Rust v0.2 binaries

            | Platform | File |
            | --- | --- |
            | macOS Apple Silicon | `easydl-darwin-arm64` |
            | macOS Intel | `easydl-darwin-x64` |
            | Linux x64, static musl | `easydl-linux-x64` |
            | Linux arm64, static musl | `easydl-linux-arm64` |
            | Windows x64 | `easydl-windows-x64.exe` |

            The zip/tar distribution also contains `README.md`, `SKILL.md`, checksums, and all binaries.

            `ffmpeg` is not bundled. Install it separately for Bilibili DASH mux tasks.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
